[project]
name = "lambda-sms"
version = "0.1.0"
description = "AWS Lambda function for Twilio SMS and call webhooks forwarding to Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "boto3>=1.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

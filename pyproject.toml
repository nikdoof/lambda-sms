[project]
name = "smsbot"
version = "0.3.0"
description = "AWS Lambda handler that forwards Twilio SMS/voice webhooks to Telegram."
authors = [{ name = "Andrew Williams", email = "andy@tensixtyone.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "moto[ssm]>=5.0",
    "boto3>=1.35",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.9",
]
github = ["pytest-github-actions-annotate-failures>=0.3.0"]

[tool.ruff]
line-length = 120

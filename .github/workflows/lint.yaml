name: Lint

"on":
  push:
    branches:
      - "main"
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --no-install-project
      - run: uv run ruff check
      - run: uv run ruff format --check
